name: Release

# Builds versioned multi-arch images on a `v*` tag and publishes a GitHub
# Release. This is independent of build.yml (which pushes :latest and rolls out
# on every push to master). Note: `oglimmer.sh release` already builds & pushes
# locally when you cut a tag — keep this workflow only if you'd rather have tag
# builds run in CI, otherwise it double-builds the release images.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write      # create GitHub Release
  packages: write      # push to ghcr.io

jobs:
  release:
    name: Build & publish images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/oglimmer/coffee-diary-backend:${{ steps.version.outputs.version }}
            ghcr.io/oglimmer/coffee-diary-backend:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/oglimmer/coffee-diary-frontend:${{ steps.version.outputs.version }}
            ghcr.io/oglimmer/coffee-diary-frontend:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
